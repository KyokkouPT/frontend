# Test runner only. The application continues to run natively.
name: kyokkoupt-web-test
services:
  frontend-test:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - pnpm_store:/root/.local/share/pnpm/store
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_DIST_DIR: .next-docker-test
    command:
      - /bin/sh
      - -lc
      - corepack enable && pnpm install --frozen-lockfile --store-dir /root/.local/share/pnpm/store && pnpm typecheck && pnpm build
volumes:
  frontend_node_modules:
  pnpm_store:
